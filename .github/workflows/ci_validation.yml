---
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline media and caption tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install media tools and caption fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install uv
        run: pipx install uv==0.12.3
      - name: Install locked Python dependencies
        run: uv sync --frozen --no-build --no-install-package rpi-gpio --no-install-package spidev
      - name: Run hardware-free tests
        env:
          PYTHONPATH: very_slow_movie_player
          VSMP_ALLOW_MOCK_HARDWARE: 'true'
        run: uv run --no-sync --no-build python -m unittest discover -s tests -v

  hooks:
    name: Prek hooks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # yamllint disable-line rule:line-length
    uses: worganisation/github-config-files/.github/workflows/__prek-hooks.yml@b9b0324c6b48dedbaa62e698a708c0f3e89042ff # 0.8.7
    with:
      python-version: '3.12'
      sync-project-dependencies: 'false'
    secrets: inherit

  actionlint:
    name: Lint workflows
    # yamllint disable-line rule:line-length
    uses: worganisation/github-config-files/.github/workflows/__actionlint.yml@61df7cff685739aef6427c565445b5508619cd0a # 0.10.0

  sonar:
    name: Sonar quality gate
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # yamllint disable-line rule:line-length
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true
