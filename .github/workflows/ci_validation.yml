---
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: Prek hooks
    # yamllint disable-line rule:line-length
    uses: worganisation/github-config-files/.github/workflows/__prek-hooks.yml@b9b0324c6b48dedbaa62e698a708c0f3e89042ff # 0.8.7
    with:
      python-version: '3.12'
      sync-project-dependencies: 'false'
    secrets: inherit

  actionlint:
    name: Lint workflows
    # yamllint disable-line rule:line-length
    uses: worganisation/github-config-files/.github/workflows/__actionlint.yml@61df7cff685739aef6427c565445b5508619cd0a # 0.10.0

  sonar:
    name: Sonar quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # yamllint disable-line rule:line-length
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true
