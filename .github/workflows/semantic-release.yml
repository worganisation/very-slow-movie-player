---
name: Semantic Release

on:
  workflow_dispatch:
    inputs:
      force-deployment:
        description: >-
          Version component to force, or auto to use semantic commit parsing.
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Release
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.WORGARSIDE_DEV_TOKEN }}

      - name: Set up Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true

      - name: Install release tooling
        run: >-
          uv pip install pip python-semantic-release==10.7.0 GitPython==3.1.59

      - name: Publish semantic release
        env:
          GH_TOKEN: ${{ secrets.WORGARSIDE_DEV_TOKEN }}
          GIT_COMMIT_AUTHOR: worgarside-dev <worgarside.dev@gmail.com>
          FORCE_DEPLOYMENT: ${{ inputs.force-deployment }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          git config --local user.name worgarside-dev
          git config --local user.email worgarside.dev@gmail.com

          command=(semantic-release -v -v --config pyproject.toml version)
          case "$FORCE_DEPLOYMENT" in
            auto) ;;
            patch|minor|major) command+=("--$FORCE_DEPLOYMENT") ;;
            *) echo "::error::Invalid release component"; exit 1 ;;
          esac

          "${command[@]}"
