---
name: Deploy VSMP Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to redeploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vsmp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !github.event.release.prerelease
    name: Deploy to VSMPPi
    environment: production-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable semantic release tag"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -Fx "$TAG"

      - name: Connect to Tailscale
        # yamllint disable-line rule:line-length
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH identity and pinned host key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          VSMP_SSH_KNOWN_HOSTS: ${{ secrets.VSMP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$VSMP_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/vsmp_deploy_key"
          printf '%s\n' "$VSMP_SSH_KNOWN_HOSTS" > "$HOME/.ssh/vsmp_known_hosts"
          chmod 600 "$HOME/.ssh/vsmp_deploy_key" "$HOME/.ssh/vsmp_known_hosts"

      - name: Deploy release tag
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          VSMP_TAILSCALE_HOSTNAME: ${{ vars.VSMP_TAILSCALE_HOSTNAME }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "::error::Invalid DEPLOY_SSH_USER"
            exit 1
          fi
          if [[ ! "$VSMP_TAILSCALE_HOSTNAME" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "::error::Invalid VSMP_TAILSCALE_HOSTNAME"
            exit 1
          fi
          ip="$(tailscale ip -4 "$VSMP_TAILSCALE_HOSTNAME")"
          ssh -i "$HOME/.ssh/vsmp_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o HostKeyAlias=vsmppi \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/vsmp_known_hosts" \
            "${DEPLOY_SSH_USER}@${ip}" \
            "bash -lc 'cd /home/${DEPLOY_SSH_USER}/very-slow-movie-player && just deploy ${TAG}'"
          echo "Deployed ${TAG} to ${VSMP_TAILSCALE_HOSTNAME}" >> "$GITHUB_STEP_SUMMARY"
