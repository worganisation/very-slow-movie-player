[project]
name = "very-slow-movie-player"
version = "1.0.3"
description = ""
authors = [{ name = "Will Garside", email = "worgarside@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rpi-gpio>=0.7.1,<1; sys_platform == 'linux'",
  "pillow>=12.3.0,<13",
  "spidev>=3.8,<4; sys_platform == 'linux'",
  "ffmpeg-python>=0.2.0,<0.3",
  "loguru>=0.7.3,<0.8",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15.0,<3",
  "paho-mqtt>=2.1.0,<3",
  "httpx2>=2.13.1,<3",
  "yt-dlp[default]>=2026.8.19,<2027",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1.0,<2"]

[tool.uv]
package = false

[dependency-groups]
dev = ["basedpyright>=1.40.1"]

[tool.codespell]
skip = '*.json,*.csv,*.xml,*.lock'

[tool.basedpyright]
typeCheckingMode = "all"
include = ["very_slow_movie_player"]
stubPath = "typings"
executionEnvironments = [
  { root = "very_slow_movie_player", extraPaths = ["very_slow_movie_player"] },
]
reportMissingImports = "error"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.12"

[tool.ruff]
fix = true
preview = true
line-length = 90
lint.select = ["ALL"]
lint.ignore = [
  "COM812", # handled by the formatter
  "ANN401", # https://docs.astral.sh/ruff/rules/any-type/
  "D107",   # https://docs.astral.sh/ruff/rules/undocumented-public-init/
  "D202",   # https://docs.astral.sh/ruff/rules/no-blank-line-after-function/
  "S314",   # https://docs.astral.sh/ruff/rules/suspicious-xml-element-tree-usage/
  "TRY003", # https://docs.astral.sh/ruff/rules/raise-vanilla-args/
  "ISC001", # https://docs.astral.sh/ruff/rules/single-line-implicit-string-concatenation/
  "TD002",  # https://docs.astral.sh/ruff/rules/missing-todo-author/
  "TD003",  # https://docs.astral.sh/ruff/rules/missing-todo-link/
  "EM",     # https://docs.astral.sh/ruff/rules/#flake8-errmsg-em
  "FIX002", # https://docs.astral.sh/ruff/rules/line-contains-todo/
  "CPY",    # https://docs.astral.sh/ruff/rules/#flake8-copyright-cpy
  "DOC201", # https://docs.astral.sh/ruff/rules/docstring-missing-returns/
  "DOC402", # https://docs.astral.sh/ruff/rules/docstring-missing-yields/
  "DOC501", # https://docs.astral.sh/ruff/rules/docstring-missing-exception/
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/**/*.py" = [
  "D101",    # https://docs.astral.sh/ruff/rules/undocumented-public-class/
  "FBT001",  # https://docs.astral.sh/ruff/rules/boolean-type-hint-positional-argument/
  "FBT002",  # https://docs.astral.sh/ruff/rules/boolean-default-value-positional-argument/
  "PT011",   # https://docs.astral.sh/ruff/rules/pytest-raises-too-broad/
  "PLR0124", # https://docs.astral.sh/ruff/rules/comparison-with-itself/
  "PLR0133", # https://docs.astral.sh/ruff/rules/comparison-of-constant/
  "PLR2004", # https://docs.astral.sh/ruff/settings/#pylint-allow-magic-value-types
  "S101",    # https://docs.astral.sh/ruff/rules/assert/
  "S105",    # https://docs.astral.sh/ruff/rules/hardcoded-password-string/
  "S106",    # https://docs.astral.sh/ruff/rules/hardcoded-password-func-arg/
  "S113",    # https://docs.astral.sh/ruff/rules/request-without-timeout/
  "S311",    # https://docs.astral.sh/ruff/rules/suspicious-non-cryptographic-random-usage/
  "S324",    # https://docs.astral.sh/ruff/rules/hashlib-insecure-hash-function/
  "INP",     # https://docs.astral.sh/ruff/rules/#flake8-no-pep420-inp
  "SLF001",  # https://docs.astral.sh/ruff/rules/private-member-access/
]

[tool.ruff.lint.pycodestyle]
max-line-length = 115

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.vulture]
min_confidence = 70
paths = ["very_slow_movie_player"]
exclude = []
sort_by_size = true

[tool.creosote]
paths = ["very_slow_movie_player"]
deps-file = "pyproject.toml"
sections = ["project.dependencies"]
exclude-deps = [
  "ffmpeg-python",
  "paho-mqtt", # creosote does not map `paho.mqtt` to its distribution name
  "pillow",
  "rpi-gpio",
  "spidev",
  "yt-dlp",
]

[tool.semantic_release]
tag_format = "{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["very_slow_movie_player/__init__.py:__version__"]
commit_message = "chore(release): {version}"
build_command = "uv lock --upgrade-package \"$PACKAGE_NAME\" && git add uv.lock"
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "deps", "docs", "feat", "fix", "hotfix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["build", "deps", "fix", "hotfix", "perf"]
parse_squash_commits = false
